[project]
name = "lifeos"
version = "0.1.0"
description = "LifeOS - a personal AI Chief of Staff. M0: backend foundation, data models, and CRUD."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "LifeOS" }]
dependencies = [
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.5.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
lifeos = "lifeos.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifeos"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer relies on function calls (typer.Option/Argument) in argument defaults.
"src/lifeos/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
packages = ["lifeos"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
